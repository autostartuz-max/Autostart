# AUTOSTART — nginx sozlamasi (xavfsizlik sarlavhalari bilan).
# Serverga o'rnatish:
#   scp -i <kalit> deploy/nginx-autostart.conf ubuntu@82.115.50.118:/tmp/
#   sudo cp /etc/nginx/sites-available/autostart /etc/nginx/sites-available/autostart.bak.$(date +%F-%H%M%S)
#   sudo mv /tmp/nginx-autostart.conf /etc/nginx/sites-available/autostart
#   sudo nginx -t && sudo systemctl reload nginx
#
# "# managed by Certbot" izohli qatorlarga tegilmagan — sertifikat yangilanganda
# certbot shu qatorlarni topib ishlaydi.

server {
    server_name autostart.uz www.autostart.uz 82.115.50.118;
    client_max_body_size 25m;

    # nginx versiyasini oshkor qilmaslik
    server_tokens off;

    # ---- Xavfsizlik sarlavhalari ----
    # HTTPS majburiy (1 yil). includeSubDomains ATAYLAB qo'yilmagan: kelajakda
    # HTTPS'siz subdomen qo'shilsa, u ishlamay qolmasin.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Brauzer fayl turini "taxmin qilmasin" — MIME-sniffing hujumiga qarshi
    add_header X-Content-Type-Options "nosniff" always;

    # Saytni begona iframe ichiga solib bo'lmasin — clickjacking'ga qarshi
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Boshqa saytga o'tganda to'liq manzil (parametrlari bilan) yuborilmasin
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Kerak bo'lmagan qurilma ruxsatlari yopiq
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Kontent manbalari. Hamma narsa o'z domenidan keladi; yagona tashqi manba —
    # index.html dagi Telegram Mini App skripti.
    #   style 'unsafe-inline' — React inline uslublari uchun zarur
    #   img/media data: va blob: — rasm yuklash va ovoz uchun
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Amaliy mashg'ulot videosini yuklash — katta fayl (500 MB gacha).
    # Umumiy 25m chegara bu yerda yetmaydi, qolgan manzillar uchun o'zgarmaydi.
    # proxy_request_buffering off — nginx faylni oldin o'ziga to'liq saqlamaydi,
    # to'g'ridan-to'g'ri Node'ga oqim qilib beradi (disk va kutish tejaladi).
    location = /api/admin/lessons {
        client_max_body_size 600m;
        client_body_timeout 900s;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_hide_header X-Powered-By;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # Express qaytaradigan texnologiya sarlavhasini yashiramiz
        proxy_hide_header X-Powered-By;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/autostart.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/autostart.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.autostart.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = autostart.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name autostart.uz www.autostart.uz 82.115.50.118;
    server_tokens off;
    return 404; # managed by Certbot
}
